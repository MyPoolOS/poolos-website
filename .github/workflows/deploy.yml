name: Deploy to HostGator

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cPanel Git Deploy
        run: |
          curl -s \
            -H "Authorization: cpanel ${{ secrets.CPANEL_USERNAME }}:${{ secrets.CPANEL_TOKEN }}" \
            "https://sh00129.hostgator.com:2083/execute/VersionControlDeployment/create" \
            --data "repository=/home1/nhqxwzte/public_html/website_2da8ad2a" \
            --data "branch=main"
