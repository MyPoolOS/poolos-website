name: Deploy to HostGator

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 sh00129.hostgator.com >> ~/.ssh/known_hosts
          ssh -p 22 nhqxwzte@sh00129.hostgator.com \
            "cd /home1/nhqxwzte/public_html/mypoolos_app && git pull"
